name: Build and Test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      # Build + tests normaux pour chaque version de Java
      - name: Build and unit tests on Java ${{ matrix.java-version }}
        run: mvn -B clean test

      # Tests de mutation (on ne les lance que pour Java 24 pour éviter les doublons)
      - name: Run mutation tests and compute score (Java 24 only)
        if: matrix.java-version == 24
        run: |
          # ⚠️ À ADAPTER avec la vraie commande de tests de mutation
          # Exemple (si vous utilisez PIT) :
          # mvn -B org.pitest:pitest-maven:mutationCoverage

          # Pour l'instant: valeur fictive, juste pour tester le workflow
          echo "80.0" > mutation_score.txt

      # Comparaison avec le score baseline
      - name: Check mutation score did not decrease (Java 24 only)
        if: matrix.java-version == 24
        run: |
          echo "=== Mutation score comparison ==="

          if [ ! -f mutation_baseline.txt ]; then
            echo "Aucun fichier baseline trouvé, utilisation de 0.0"
            echo "0.0" > mutation_baseline.txt
          fi

          NEW_SCORE=$(cat mutation_score.txt)
          BASELINE_SCORE=$(cat mutation_baseline.txt)

          echo "Baseline: $BASELINE_SCORE"
          echo "New:      $NEW_SCORE"

          # Comparaison des deux scores avec awk (gère les nombres à virgule)
          is_less=$(awk -v new="$NEW_SCORE" -v base="$BASELINE_SCORE" 'BEGIN { if (new < base) print "yes"; else print "no"; }')

          if [ "$is_less" = "yes" ]; then
            echo "Mutation score decreased: $NEW_SCORE < $BASELINE_SCORE"
            exit 1
          else:
            echo "Mutation score OK: $NEW_SCORE >= $BASELINE_SCORE"
          fi

          # On ne met PAS à jour mutation_baseline.txt ici.
          # Vous le mettrez à jour manuellement dans le repo
          # quand vous serez satisfaits du nouveau score.

  # Rickroll si le job build échoue
  rickroll:
    needs: build
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Never gonna give you up
        run: |
          echo "Les tests ou le score de mutation ont échoué..."
          echo "Never gonna give you up, never gonna let you down 🎵"
          echo "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
